[project]
name = "fraudops"
version = "0.1.0"
description = "POS fraud detection with a full MLOps loop: training, serving, monitoring, drift-triggered retraining"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=17",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "lightgbm>=4.5",
  "imbalanced-learn>=0.12",
  "joblib>=1.4",
  "mlflow-skinny>=2.16",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "prometheus-client>=0.21",
  "pydantic>=2.8",
]

[project.optional-dependencies]
demo = ["gradio>=5.0", "httpx>=0.27"]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
fraudops-train = "fraudops.train:main"
fraudops-generate = "fraudops.data:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudops"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
