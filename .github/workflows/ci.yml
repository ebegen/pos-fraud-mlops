name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        # runner's system Python is externally managed: install into an activated venv
        with: { python-version: "3.12", activate-environment: true }
      - run: uv pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Train a model and check the quality bar
        run: |
          python -m fraudops.train --fast --n 30000 --out models/candidate
          python -c "import json; m=json.load(open('models/candidate/meta.json')); print(m['test']); assert m['test']['pr_auc'] > 0.6, 'PR-AUC below bar'"

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kubernetes manifests
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          kubectl kustomize k8s | ./kubeconform -strict -summary -

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: pos-fraud-mlops:ci
