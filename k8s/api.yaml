# Scoring API on Kubernetes: Deployment + Service + HPA + PodDisruptionBudget.
# The model bundle lives on a PVC written by the retraining job (see train-job.yaml);
# a rollout restart (or POST /admin/reload) picks up a new champion.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-api
  labels: { app: fraud-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: fraud-api }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: fraud-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      containers:
        - name: api
          image: pos-fraud-mlops:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000, name: http }]
          env:
            - { name: MODEL_DIR, value: /models/champion }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: fraud-models }
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-api
  labels: { app: fraud-api }
spec:
  selector: { app: fraud-api }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fraud-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: fraud-api }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fraud-api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: fraud-api }
